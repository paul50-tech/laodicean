<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle concentric campus signal arcs -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="3" opacity="0.2" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Gold mortarboard graduation cap at top -->
  <g transform="translate(256, 125)" filter="url(#shadow)">
    <!-- Cap Diamond -->
    <polygon points="0,-40 75,0 0,40 -75,0" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3" />
    <!-- Cap Under-band -->
    <path d="M-45,15 Q0,45 45,15 L45,30 Q0,60 -45,30 Z" fill="#b45309" />
    <!-- Tassel -->
    <path d="M0,0 Q35,10 50,42 L55,75" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <circle cx="55" cy="78" r="7" fill="#f59e0b" />
  </g>

  <!-- Stylized Monogram "L" + Live Pulse Motif -->
  <g filter="url(#shadow)">
    <!-- Main bold vertical stem of L -->
    <rect x="150" y="190" width="48" height="195" rx="20" fill="#ffffff" />
    
    <!-- Base horizontal arm of L -->
    <rect x="150" y="340" width="180" height="48" rx="20" fill="#ffffff" />

    <!-- Dynamic campus pulse wave bridging into the L arm -->
    <path d="M 230 260 L 260 215 L 290 295 L 320 240 L 350 265" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="355" cy="265" r="8" fill="#fbbf24" />
  </g>
</svg>
